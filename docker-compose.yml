# Local development stack: PostgreSQL, the FastAPI backend and the Next.js
# dashboard.
#
# Docker is the ONLY host prerequisite. Neither Python nor Node is installed
# on the host; both toolchains live in their service's image.
#
# Usage:
#   cp .env.example .env      # once, then adjust if you like
#   docker compose up         # start everything
#   docker compose down       # stop, KEEPING database contents
#   docker compose down -v    # stop and DESTROY database contents
#
# There is no `version:` key. It was required by the legacy docker-compose v1
# and is ignored (with a warning) by modern Compose.

# Fixes the project name. Without this, Compose derives it from the directory
# name, so a renamed or differently-cloned folder would silently create a
# separate set of containers and volumes.
name: restaurant-intelligence

services:
  db:
    image: postgres:16-alpine
    # Pinned to a major version deliberately. `postgres:latest` would let this
    # machine and a reviewer's machine resolve to different majors, and
    # PostgreSQL major versions have incompatible on-disk data directories.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Published for developer convenience only (psql, TablePlus, DBeaver).
      # The api service does NOT need this: containers reach each other over
      # the private Compose network regardless of what is published here.
      #
      # Bound to 127.0.0.1 explicitly. Without a host address Docker binds to
      # 0.0.0.0 — every interface — which puts the database on the local
      # network and reachable by anything sharing the café/coworking wifi.
      # Loopback keeps it reachable from this machine only.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume, not a bind mount. Postgres writes its data here, and the
      # volume outlives the container — so `docker compose down` stops the
      # database without erasing it.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # "Running" and "ready" are different states. On first boot Postgres
      # starts, runs initdb, creates the database and restarts internally —
      # for several seconds the process exists but refuses connections.
      # pg_isready reports readiness rather than mere liveness.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    # Built from our own source, not pulled from a registry.
    build: ./backend
    # Overrides the image's production CMD for local development. --reload
    # watches the bind-mounted source below and restarts uvicorn on save;
    # it is deliberately absent from the image itself.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      # Host is `db` — the service name, resolved by Compose's built-in DNS.
      # NOT localhost: inside a container, localhost means that container.
      # Driver is psycopg (v3), not psycopg2.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # A SEPARATE database on the SAME PostgreSQL server, used by pytest and
      # by nothing else. The suite is destructive — it truncates every sales
      # table and downgrades the schema to base — so it must not be pointed at
      # the database holding imported Square data and serving the dashboard.
      #
      # A second database rather than a second server: the isolation needed is
      # between datasets, not between engines, and running one PostgreSQL means
      # the tests keep exercising the same version and the same configuration
      # the application runs against.
      #
      # backend/tests/conftest.py reads this, refuses to run if it is missing
      # or does not name a `_test` database, and creates the database on first
      # use. It never falls back to DATABASE_URL.
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_TEST_DB:-restaurant_intelligence_test}
    ports:
      # Bound to 127.0.0.1 on the host, matching the db service. Note this is
      # a different layer to uvicorn's --host 0.0.0.0: uvicorn must listen on
      # all interfaces INSIDE the container to be reachable at all, while this
      # controls which host interface Docker publishes the port on.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      # Bind mount, the opposite tool to the volume above: edits saved on the
      # host appear instantly inside the container, so uvicorn --reload
      # restarts on save with no image rebuild.
      - ./backend:/app
    healthcheck:
      # Uses /health (liveness), NOT /health/ready. A container healthcheck
      # decides whether to restart the container, so wiring it to a
      # dependency check would restart the API whenever Postgres hiccups.
      #
      # localhost is correct here — unlike the DATABASE_URL above, this
      # request is the container talking to itself.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        # Waits for the healthcheck to PASS. The bare list form of depends_on
        # waits only for the container to START, which races against Postgres
        # initialisation and fails intermittently — worst of all on a cold
        # first clone, which is exactly a reviewer's experience.
        #
        # This solves startup ordering only. The database can still fail at
        # runtime; that needs connection retry in the application layer.
        condition: service_healthy

  web:
    # The Next.js dashboard. Built from our own source; Node is deliberately
    # NOT a host prerequisite, so this service is the only place it exists.
    build:
      context: ./frontend
      # The image also defines a production build + runtime. Development stops
      # at `dev`, which carries the dev dependencies the other stages drop.
      target: dev
    # Overrides the image CMD only to be explicit about what local development
    # runs. --hostname 0.0.0.0 lives in the npm script: inside a container the
    # default of localhost means that container, so the server would be
    # unreachable from the host no matter what ports are published below.
    command: ["npm", "run", "dev"]
    environment:
      # SERVER-ONLY. Read by next.config.ts to target the rewrite, so it is
      # never sent to the browser. `api` is the Compose service name, resolved
      # by Compose's internal DNS and meaningless outside this network — which
      # is exactly why it must not leak into client-side code. Publishing it as
      # NEXT_PUBLIC_* would inline it into the JavaScript bundle and every
      # browser request to http://api:8000 would fail to resolve.
      API_UPSTREAM_URL: http://api:8000
      # Browser-visible base. Same-origin by design: the browser calls
      # localhost:3000/api/..., the Next server forwards it to the API, and no
      # cross-origin request is ever made — so the backend needs no CORS policy.
      NEXT_PUBLIC_API_BASE_URL: /api
      # macOS and Windows bind mounts do not deliver inotify events into the
      # container, so file watching silently never fires and hot reload appears
      # broken. Polling costs a little CPU and is the standard trade.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      # Bound to 127.0.0.1 like db and api, for the same reason: without a host
      # address Docker publishes on every interface, putting the dashboard on
      # whatever network this laptop is attached to.
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      # Bind mount for hot reload: edits saved on the host appear immediately
      # inside the container.
      - ./frontend:/app
      # ...but that bind mount would also shadow /app/node_modules with the
      # host directory, which does not exist — Node is not installed on the
      # host. This named volume masks that one path so the container keeps the
      # dependencies `npm ci` installed into the image.
      #
      # Trade-off: the volume outlives the image, so it does NOT pick up a
      # changed package-lock.json on its own. After changing dependencies,
      # rebuild and replace THIS volume by name:
      #
      #   docker compose build web
      #   docker compose rm -sf web
      #   docker volume rm restaurant-intelligence_frontend_node_modules
      #   docker compose up -d web
      #
      # Named explicitly rather than via `docker compose down -v`, which
      # removes every volume in the project — including postgres_data, and with
      # it the imported Square data the dashboard is showing.
      - frontend_node_modules:/app/node_modules
      # Likewise for the build cache. Keeping .next off the bind mount avoids
      # writing thousands of small files across the macOS filesystem boundary,
      # which is the single biggest cause of a slow dev server here.
      - frontend_next_cache:/app/.next
    healthcheck:
      # Requests the dashboard itself. `next dev` compiles a route on first
      # request, so this is what makes `docker compose up --wait` return when
      # the page is actually servable rather than the moment the process
      # starts — the difference between a working URL and a spinning tab.
      #
      # Any response below 500 counts: a 404 would still prove the server is
      # answering. The generous start_period covers that first compile.
      #
      # `node -e` rather than curl: the Alpine node image ships neither curl
      # nor wget, and adding one to a dev image for a healthcheck is a poor
      # trade when the runtime already speaks HTTP.
      test: ["CMD", "node", "-e",
             "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      api:
        # STARTUP ordering only, and deliberately not more than that. The rewrite
        # target is resolved per-request at runtime, so a dev server started
        # before the API is merely a dashboard whose first request fails and
        # whose next one succeeds. Waiting for health here buys an orderly
        # `up`, not runtime resilience — that belongs in the request path, and
        # is why the API client surfaces an unreachable upstream as a readable
        # error rather than a stack trace.
        condition: service_healthy

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next_cache:
